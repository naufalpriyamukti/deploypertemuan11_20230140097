<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Dashboard - Home</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-page: #f8fafc;
            --bg-container: #ffffff;
            --primary-dark: #0f172a; /* Slate 900 */
            --text-main: #334155;    /* Slate 700 */
            --text-muted: #64748b;   /* Slate 500 */
            --border-color: #e2e8f0; /* Slate 200 */
            --danger-color: #dc2626; /* Red 600 */
            --danger-hover: #b91c1c; /* Red 700 */
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-page);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            background: var(--bg-container);
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05), 0 0 0 1px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 480px;
            overflow: hidden;
        }

        .header {
            background-color: var(--primary-dark);
            color: #ffffff;
            padding: 24px 32px;
            display: flex;
            align-items: center;
            gap: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .header-icon {
            background: rgba(255, 255, 255, 0.1);
            padding: 10px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .header-text h1 {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: -0.025em;
            line-height: 1.2;
        }

        .header-text p {
            font-size: 13px;
            color: var(--text-muted);
            color: #94a3b8;
            margin-top: 4px;
        }

        .content {
            padding: 32px;
        }

        .info-card {
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: #ffffff;
            margin-bottom: 24px;
        }

        .info-row {
            display: flex;
            align-items: center;
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 140px;
            flex-shrink: 0;
        }

        .info-icon {
            color: var(--text-muted);
            display: flex;
            align-items: center;
        }

        .info-label {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .info-value {
            flex: 1;
            font-size: 15px;
            color: var(--primary-dark);
            font-weight: 500;
            word-break: break-word;
        }


        .logout-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 12px;
            background-color: transparent;
            color: var(--danger-color);
            border: 1px solid var(--danger-color);
            text-align: center;
            text-decoration: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .logout-btn:hover {
            background-color: var(--danger-color);
            color: #ffffff;
        }

        .logout-btn svg {
            fill: currentColor;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="header-icon">
            <!-- Modern Dashboard SVG Icon -->
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-grid"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
        </div>
        <div class="header-text">
            <h1>Enterprise Console</h1>
            <p>User Account Dashboard</p>
        </div>
    </div>

    <div class="content">
        <div class="info-card">
            <!-- Username Row -->
            <div class="info-row">
                <div class="info-label-wrapper">
                    <span class="info-icon">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    </span>
                    <span class="info-label">Username</span>
                </div>
                <div class="info-value" th:text="${user.username}">admin_enterprise</div>
            </div>

            <div class="info-row">
                <div class="info-label-wrapper">
                    <span class="info-icon">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                    </span>
                    <span class="info-label">Nama</span>
                </div>
                <div class="info-value" th:text="${profile.nama}">PT. Solusi Perdana</div>
            </div>

            <div class="info-row">
                <div class="info-label-wrapper">
                    <span class="info-icon">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                    </span>
                    <span class="info-label">Alamat</span>
                </div>
                <div class="info-value" th:text="${profile.alamat}">Sudirman Central Business District, Jakarta</div>
            </div>
        </div>

        <a th:href="@{/logout}" class="logout-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
            Sign Out Session
        </a>
    </div>
</div>
</body>
</html>
