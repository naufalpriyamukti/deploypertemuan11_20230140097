<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-page: #f1f5f9;
            --bg-container: #ffffff;
            --primary: #0f172a;
            --primary-accent: #1e293b;
            --text-main: #334155;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
            --border-focus: #2563eb;
            --error-bg: #fee2e2;
            --error-text: #991b1b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-page);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            -webkit-font-smoothing: antialiased;
        }

        .login-container {
            background: var(--bg-container);
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 0 0 1px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 400px;
            overflow: hidden;
        }

        .header {
            background-color: var(--primary);
            color: #ffffff;
            padding: 32px 32px 24px 32px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .header h1 {
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.025em;
        }

        .header p {
            font-size: 13px;
            color: #94a3b8;
            margin-top: 6px;
        }

        .form-container {
            padding: 32px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            color: var(--text-main);
            font-size: 13px;
        }

        .input-group input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 14px;
            transition: all 0.15s ease;
            outline: none;
            color: var(--primary);
            background-color: #fff;
        }

        .input-group input:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .login-btn {
            width: 100%;
            padding: 11px;
            background-color: var(--primary);
            color: #ffffff;
            border: 1px solid var(--primary);
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .login-btn:hover {
            background-color: var(--primary-accent);
            border-color: var(--primary-accent);
        }

        .register-link {
            text-align: center;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid #e2e8f0;
        }

        .register-link p {
            color: var(--text-muted);
            font-size: 13px;
            margin-bottom: 8px;
        }

        .register-link a {
            color: var(--border-focus);
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        .error-message {
            background: var(--error-bg);
            color: var(--error-text);
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 13px;
            font-weight: 500;
            border: 1px solid rgba(153, 27, 27, 0.1);
        }
    </style>
</head>
<body>
<div class="login-container">
    <div class="header">
        <h1>Enterprise Portal</h1>
        <p>Sign in to access your account console</p>
    </div>
    <div class="form-container">
        <form th:action="@{/login}" method="post">
            <div class="input-group">
                <label>Username</label>
                <input type="text" name="username" placeholder="Enter your username" required autocomplete="username">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
            </div>
            <button type="submit" class="login-btn">Sign In</button>
        </form>
        <div class="register-link">
            <p>Don't have an account?</p>
            <a th:href="@{/register}">Register here</a>
        </div>
    </div>
</div>
</body>
</html>
